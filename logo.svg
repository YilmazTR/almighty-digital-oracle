<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="Almighty Digital Oracle logo">
  <defs>
    <radialGradient id="halo" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#f5f1ff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#c9a6ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0a0714" stop-opacity="0"/>
    </radialGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <!-- soft halo backdrop -->
  <circle cx="100" cy="105" r="95" fill="url(#halo)" opacity="0.9"/>

  <!-- hood silhouette (outer) -->
  <path d="M100 8
           C 148 8, 182 55, 176 108
           C 172 148, 158 178, 138 196
           C 124 208, 112 214, 100 214
           C 88 214, 76 208, 62 196
           C 42 178, 28 148, 24 108
           C 18 55, 52 8, 100 8 Z"
        fill="#0a0714" filter="url(#soften)"/>

  <!-- inner hood shadow -->
  <path d="M100 30
           C 136 30, 158 62, 154 108
           C 151 138, 140 162, 124 178
           C 114 188, 106 192, 100 192
           C 94 192, 86 188, 76 178
           C 60 162, 49 138, 46 108
           C 42 62, 64 30, 100 30 Z"
        fill="#0f0a1f"/>

  <!-- eyes -->
  <ellipse cx="78" cy="108" rx="11" ry="4.4" fill="#ffffff" filter="url(#soften)"/>
  <ellipse cx="122" cy="108" rx="11" ry="4.4" fill="#ffffff" filter="url(#soften)"/>
  <ellipse cx="78" cy="108" rx="6" ry="2.2" fill="#ffffff"/>
  <ellipse cx="122" cy="108" rx="6" ry="2.2" fill="#ffffff"/>

  <!-- central diamond -->
  <path d="M100 130 L110 142 L100 154 L90 142 Z" fill="#e0ccff" opacity="0.85"/>

  <!-- dotted constellation texture -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="46" cy="60" r="1.6"/>
    <circle cx="72" cy="36" r="1.9"/>
    <circle cx="100" cy="26" r="2.2"/>
    <circle cx="128" cy="36" r="1.9"/>
    <circle cx="154" cy="60" r="1.6"/>
    <circle cx="34" cy="96" r="1.7"/>
    <circle cx="166" cy="96" r="1.7"/>
    <circle cx="38" cy="132" r="1.6"/>
    <circle cx="162" cy="132" r="1.6"/>
    <circle cx="56" cy="168" r="1.9"/>
    <circle cx="144" cy="168" r="1.9"/>
    <circle cx="80" cy="196" r="1.8"/>
    <circle cx="120" cy="196" r="1.8"/>
    <circle cx="100" cy="204" r="2"/>
    <circle cx="100" cy="86" r="1.6"/>
    <circle cx="66" cy="86" r="1.4"/>
    <circle cx="134" cy="86" r="1.4"/>
  </g>
  <g fill="#c9a6ff" opacity="0.85">
    <circle cx="58" cy="52" r="1.1"/>
    <circle cx="142" cy="52" r="1.1"/>
    <circle cx="100" cy="44" r="1.3"/>
    <circle cx="72" cy="122" r="1.1"/>
    <circle cx="128" cy="122" r="1.1"/>
    <circle cx="84" cy="168" r="1.1"/>
    <circle cx="116" cy="168" r="1.1"/>
  </g>
</svg>