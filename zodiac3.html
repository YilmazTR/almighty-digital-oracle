<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zodiac Oracle · 12 signs, 12 questions</title>
  <style>
    /* ---------- DARK CELESTIAL PALETTE ---------- */
    :root {
      --bg: #0b0e1a;
      --panel: #151b2b;
      --panel-light: #1f2a3f;
      --text: #e8ecf5;
      --text-muted: #b0b8cc;
      --accent: #b7a9ff;
      --accent-glow: #8a7aff;
      --border: #2e3a52;
      --focus: #c5b9ff;
      --star: rgba(255, 255, 240, 0.8);
      --shadow: 0 10px 30px -8px rgba(0, 0, 0, 0.8);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.2rem;
      position: relative;
      overflow-x: hidden;
    }

    /* ---------- SUBTLE STARFIELD (pseudo + radial) ---------- */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        radial-gradient(1px 1px at 10% 20%, var(--star) 1px, transparent 1px),
        radial-gradient(1px 1px at 30% 70%, var(--star) 1px, transparent 1px),
        radial-gradient(2px 2px at 80% 15%, rgba(255,255,240,0.9) 1px, transparent 1px),
        radial-gradient(1px 1px at 55% 45%, var(--star) 1px, transparent 1px),
        radial-gradient(2px 2px at 92% 78%, rgba(255,255,240,0.85) 1px, transparent 1px),
        radial-gradient(1px 1px at 5% 90%, var(--star) 1px, transparent 1px),
        radial-gradient(2px 2px at 45% 8%, rgba(255,255,240,0.9) 1px, transparent 1px),
        radial-gradient(1px 1px at 72% 55%, var(--star) 1px, transparent 1px),
        radial-gradient(1px 1px at 18% 42%, var(--star) 1px, transparent 1px),
        radial-gradient(1.5px 1.5px at 96% 32%, rgba(255,255,240,0.9) 1px, transparent 1px);
      background-repeat: repeat;
      background-size: 200px 200px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.7;
    }

    /* extra twinkle layer */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 40%, rgba(138, 122, 255, 0.06) 0%, transparent 40%),
                  radial-gradient(circle at 90% 70%, rgba(183, 169, 255, 0.05) 0%, transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 2;
      background: var(--panel);
      max-width: 720px;
      width: 100%;
      border-radius: var(--radius);
      padding: 2rem 1.8rem;
      box-shadow: var(--shadow), 0 0 0 1px var(--border) inset;
      backdrop-filter: blur(4px);
      transition: all 0.25s ease;
      border: 1px solid #2a3550;
    }

    /* ---------- TYPOGRAPHY ---------- */
    h1, h2 {
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .progress-wrap {
      margin-bottom: 1.5rem;
    }

    .progress-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .progress-bar {
      height: 6px;
      background: #1e2538;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #2b354c;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8a7aff, #c5b9ff);
      border-radius: 20px;
      transition: width 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
      box-shadow: 0 0 10px rgba(138, 122, 255, 0.5);
    }

    .question-text {
      font-size: 1.6rem;
      font-weight: 420;
      margin: 0.8rem 0 1.8rem;
      line-height: 1.3;
      color: #f0f3ff;
      text-wrap: balance;
    }

    @media (max-width: 500px) {
      .question-text {
        font-size: 1.35rem;
      }
    }

    /* ---------- BUTTONS (ANSWERS) ---------- */
    .answers {
      display: grid;
      gap: 0.9rem;
      margin-top: 0.5rem;
    }

    .answer-btn {
      background: var(--panel-light);
      color: var(--text);
      border: 1px solid #2f3b57;
      border-radius: 14px;
      padding: 1rem 1.2rem;
      font-size: 1rem;
      line-height: 1.45;
      text-align: left;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      word-break: break-word;
      width: 100%;
    }

    .answer-btn:hover:not(:disabled) {
      background: #25334c;
      border-color: var(--accent);
    }

    .answer-btn:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
      border-color: var(--accent);
      background: #25334c;
    }

    .answer-btn:active:not(:disabled) {
      transform: scale(0.98);
      background: #1c263b;
    }

    .answer-btn:disabled {
      opacity: 0.5;
      cursor: default;
      filter: grayscale(0.3);
    }

    /* ---------- RESULT SCREEN ---------- */
    .result-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fadeSlide 0.5s ease;
    }

    .glyph {
      font-size: 5.5rem;
      line-height: 1;
      margin-bottom: 0.2rem;
      filter: drop-shadow(0 0 16px rgba(183, 169, 255, 0.5));
      font-weight: 300;
    }

    .sign-name {
      font-size: 2.6rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin: 0;
      color: #fff;
    }

    .date-range {
      color: var(--text-muted);
      font-size: 1rem;
      letter-spacing: 0.05em;
      margin-bottom: 1.8rem;
      border-bottom: 1px solid #2d3a55;
      padding-bottom: 1.2rem;
      width: 100%;
    }

    .verdict {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
      color: #dde3f0;
      text-wrap: pretty;
    }

    .trait-chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.7rem;
      margin-bottom: 1.8rem;
    }

    .chip {
      background: #1f2a44;
      border: 1px solid #39496b;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 500;
      color: #d0d9ff;
      white-space: nowrap;
    }

    .match-line, .shadow-line {
      font-size: 1rem;
      margin: 0.5rem 0;
      color: #cbd4e8;
    }

    .match-line strong, .shadow-line strong {
      color: #efeaff;
      font-weight: 500;
    }

    .shadow-line {
      border-top: 1px dashed #2b3855;
      padding-top: 1rem;
      margin-top: 1rem;
      margin-bottom: 2rem;
      font-style: italic;
      color: #b7c0d6;
    }

    .reset-btn {
      background: transparent;
      border: 2px solid var(--accent);
      color: var(--accent);
      padding: 0.85rem 2.2rem;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      letter-spacing: 0.03em;
      margin-top: 0.5rem;
    }

    .reset-btn:hover {
      background: var(--accent);
      color: #0b0e1a;
      box-shadow: 0 0 20px rgba(183, 169, 255, 0.4);
    }

    .reset-btn:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---------- ACCESSIBILITY / RESPONSIVE ---------- */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 400px) {
      .app {
        padding: 1.5rem 1.2rem;
      }
      .glyph {
        font-size: 4.2rem;
      }
      .sign-name {
        font-size: 2rem;
      }
      .question-text {
        font-size: 1.25rem;
      }
      .answer-btn {
        padding: 0.9rem 1rem;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
