<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Almighty Digital Oracle</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%230a0714'/%3E%3Cg fill='%23c9a6ff'%3E%3Ccircle cx='16' cy='20' r='2.5'/%3E%3Ccircle cx='32' cy='14' r='2.5'/%3E%3Ccircle cx='48' cy='20' r='2.5'/%3E%3Ccircle cx='14' cy='36' r='2.5'/%3E%3Ccircle cx='50' cy='36' r='2.5'/%3E%3Ccircle cx='20' cy='50' r='2.5'/%3E%3Ccircle cx='44' cy='50' r='2.5'/%3E%3Cpath d='M32 24 L40 32 L32 40 L24 32 Z' fill='%23e0ccff'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{
    --bg:#fafafa;
    --panel:#ffffff;
    --ink:#1d1d1f;
    --ink-soft:#424245;
    --dim:#6e6e73;
    --line:#d2d2d7;
    --line-soft:#e8e8ed;
    --accent:#0071e3;
    --accent-soft:#f0f7ff;
    --success:#1a8c4a;
    --shadow:0 4px 24px rgba(0,0,0,.06);
    --radius:18px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; min-height:100vh;
    font-family:var(--font);
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    padding:32px 18px;
  }
  .wrap{width:100%; max-width:720px; position:relative}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px;
    margin-bottom:18px;
    padding:0 6px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-size:14px; font-weight:500; color:var(--dim);
    letter-spacing:-.01em;
  }
  .brand .oracle-icon{width:24px; height:24px; flex:0 0 auto}
  .lang-toggle{
    display:inline-flex;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:999px;
    padding:2px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .lang-toggle button{
    font:inherit;
    font-size:13px;
    font-weight:500;
    letter-spacing:-.01em;
    border:0;
    background:transparent;
    color:var(--dim);
    padding:6px 14px;
    border-radius:999px;
    cursor:pointer;
    transition:background .18s ease,color .18s ease;
  }
  .lang-toggle button[aria-pressed="true"]{
    background:var(--ink);
    color:#fff;
  }
  .lang-toggle button:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line-soft);
    border-radius:var(--radius);
    padding:40px 38px 44px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }

  .hero{
    display:flex; align-items:center; gap:14px;
    margin:0 0 6px;
  }
  .hero .hero-icon{width:42px; height:42px; flex:0 0 auto}
  .title{
    font-size:clamp(1.6rem, 3.4vw, 2.2rem);
    font-weight:600;
    letter-spacing:-.025em;
    line-height:1.15;
    margin:0;
    color:var(--ink);
  }
  .subtitle{
    font-size:15px;
    color:var(--dim);
    margin:6px 0 28px;
    letter-spacing:-.01em;
  }

  .section-tag{
    display:inline-block;
    font-size:11px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent);
    background:var(--accent-soft);
    padding:4px 10px;
    border-radius:999px;
    margin-bottom:14px;
  }

  .progress-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:12px;
    color:var(--dim);
    letter-spacing:.02em;
    margin-bottom:8px;
    font-variant-numeric:tabular-nums;
  }
  .bar{
    height:4px;
    background:var(--line-soft);
    border-radius:99px;
    overflow:hidden;
    margin-bottom:26px;
  }
  .bar > i{
    display:block;
    height:100%;
    width:0;
    background:linear-gradient(90deg,#0071e3,#5e5ce6);
    border-radius:99px;
    transition:width .5s cubic-bezier(.4,0,.2,1);
  }

  .q{
    font-size:clamp(1.15rem, 2.1vw, 1.35rem);
    font-weight:500;
    letter-spacing:-.015em;
    line-height:1.4;
    margin:0 0 22px;
    color:var(--ink);
  }
  .opts{display:grid; gap:10px}
  button.opt{
    text-align:left;
    font:inherit;
    font-size:15px;
    font-weight:400;
    color:var(--ink);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:15px 18px;
    cursor:pointer;
    transition:border-color .18s ease, background .18s ease, transform .12s ease;
    width:100%;
    letter-spacing:-.01em;
    line-height:1.45;
  }
  button.opt:hover:not(:disabled){
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  button.opt:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
    border-color:var(--accent);
  }
  button.opt:active:not(:disabled){transform:scale(.995)}
  button.opt:disabled{opacity:.4; cursor:default}

  .thinking{
    margin-top:24px;
    padding:14px 16px;
    background:#f5f5f7;
    border-radius:12px;
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.5;
    display:flex;
    gap:10px;
    align-items:flex-start;
    letter-spacing:-.005em;
    min-height:44px;
  }
  .thinking .pulse{
    flex:0 0 auto;
    width:8px; height:8px; border-radius:50%;
    background:var(--accent);
    margin-top:6px;
    animation:pulse 1.6s ease-in-out infinite;
  }
  .thinking .pulse.done{
    background:var(--success);
    animation:none;
  }
  .thinking .txt b{color:var(--ink); font-weight:600}
  @keyframes pulse{
    0%,100%{opacity:.35; transform:scale(.9)}
    50%{opacity:1; transform:scale(1.15)}
  }

  .result{animation:fade .5s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .zodiac-block{
    padding:22px 0 24px;
    border-bottom:1px solid var(--line-soft);
    margin-bottom:24px;
  }
  .glyph{
    font-size:56px; line-height:1;
    margin-bottom:6px;
    background:linear-gradient(135deg,#0071e3,#5e5ce6);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
  }
  .sign-name{
    font-size:clamp(1.8rem,4.5vw,2.5rem);
    font-weight:600;
    letter-spacing:-.03em;
    margin:0 0 4px;
    color:var(--ink);
  }
  .dates{
    font-size:13px;
    letter-spacing:.04em;
    color:var(--dim);
    text-transform:uppercase;
    margin-bottom:18px;
  }
  .verdict{
    font-size:15.5px;
    line-height:1.6;
    color:var(--ink-soft);
    letter-spacing:-.01em;
    margin:0 0 18px;
  }
  .traits{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px}
  .chip{
    font-size:12px;
    font-weight:500;
    padding:6px 12px;
    border-radius:999px;
    background:#f5f5f7;
    color:var(--ink-soft);
    letter-spacing:-.005em;
  }
  .meta-line{
    font-size:13.5px;
    line-height:1.55;
    color:var(--dim);
    letter-spacing:-.005em;
    margin:6px 0 0;
  }
  .meta-line b{color:var(--ink); font-weight:600}

  .mbti-block{
    padding:4px 0 8px;
  }
  .mbti-label{
    font-size:11px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:10px;
  }
  .mbti-type{
    font-size:clamp(1.9rem,5vw,2.6rem);
    font-weight:600;
    letter-spacing:-.02em;
    margin:0 0 2px;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .mbti-name{
    font-size:15px;
    color:var(--ink-soft);
    font-weight:500;
    margin:0 0 16px;
    letter-spacing:-.01em;
  }
  .mbti-axes{
    display:grid;
    grid-template-columns:repeat(2, minmax(0,1fr));
    gap:8px 18px;
    margin:0 0 18px;
    font-size:13px;
    color:var(--dim);
  }
  .mbti-axes .row{display:flex; justify-content:space-between; gap:10px}
  .mbti-axes .row span:last-child{color:var(--ink); font-weight:500}
  .mbti-desc{
    font-size:15.5px;
    line-height:1.6;
    color:var(--ink-soft);
    letter-spacing:-.01em;
    margin:0 0 14px;
  }
  .bridge{
    margin-top:22px;
    padding:16px 18px;
    background:#f5f5f7;
    border-radius:12px;
    font-size:14px;
    line-height:1.55;
    color:var(--ink-soft);
    letter-spacing:-.005em;
  }
  .bridge b{color:var(--ink); font-weight:600}
  .disclaimer{
    margin-top:16px;
    font-size:11.5px;
    line-height:1.5;
    color:var(--dim);
    letter-spacing:.005em;
  }

  .cta{
    font:inherit;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    margin-top:24px;
    background:var(--accent);
    color:#fff;
    border:0;
    border-radius:999px;
    padding:12px 26px;
    letter-spacing:-.01em;
    transition:background .18s ease, transform .12s ease;
  }
  .cta:hover{background:#0077ed}
  .cta:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
  .cta:active{transform:scale(.98)}

  .footer{
    margin-top:14px;
    text-align:right;
    font-size:12px;
    color:var(--dim);
    letter-spacing:.01em;
    padding:0 6px;
  }

  @media (max-width:520px){
    .card{padding:30px 22px 34px}
    .topbar{flex-wrap:wrap}
    button.opt{font-size:14.5px; padding:14px 16px}
    .mbti-axes{grid-template-columns:1fr}
  }
</style>
</head>
<body>

/* ============================================================

const SIGNS = {
  aries:{name:{en:"Aries",tr:"Koç"},glyph:"♈",dates:{en:"Mar 21 – Apr 19",tr:"21 Mar – 19 Nis"},traits:{en:["Impulsive","Brave","Terrible at queues"],tr:["Dürtüsel","Cesur","Sıra bekleyemez"]},verdict:{en:"You are a golden retriever in human form who has never once read the room before charging into it. Your spirit animal is the shopping cart with one broken wheel: unstoppable, slightly dangerous, occasionally airborne. You've started three hobbies this week and abandoned two of them before lunch.",tr:"İnsan formuna bürünmüş bir golden retriever'sınız ve odayı okumadan içine dalmayı bir kez olsun akıl etmediniz. Ruh hayvanınız tek tekerleği kırık bir alışveriş arabası: durdurulamaz, biraz tehlikeli, ara sıra havada. Bu hafta üç hobiye başladınız, ikisini öğle yemeğinden önce bıraktınız."},match:{en:"Sagittarius (co-conspirators) or Leo (mutual hype squad)",tr:"Yay (suç ortakları) ya da Aslan (karşılıklı moral ekibi)"},shadow:{en:"Your shadow side treats patience like a personal insult.",tr:"Gölge yönünüz sabrı kişisel bir hakaret gibi görüyor."}},
  taurus:{name:{en:"Taurus",tr:"Boğa"},glyph:"♉",dates:{en:"Apr 20 – May 20",tr:"20 Nis – 20 May"},traits:{en:["Loyal","Deliciously stubborn","Ruthless about snacks"],tr:["Sadık","Tatlı bir inatçı","Atıştırmalıkta acımasız"]},verdict:{en:"You have the emotional volatility of a very comfortable armchair, and honestly? Respect. You will forgive almost anything except someone eating the last of something without asking. Your love language is feeding people and quietly judging their life choices while doing it.",tr:"Duygusal dalgalanmanız son derece rahat bir koltuk kadar. Dürüst olmak gerekirse? Saygı duyuyorum. Neredeyse her şeyi affedersiniz; birinin sormadan son lokmayı yemesini asla. Sevgi diliniz insanları doyurmak ve bunu yaparken hayat seçimlerini sessizce yargılamak."},match:{en:"Virgo (shared standards) or Cancer (soft landing)",tr:"Başak (ortak standartlar) ya da Yengeç (yumuşak iniş)"},shadow:{en:"Your shadow side calls it 'consistency' when it's really a drawbridge.",tr:"Gölge yönünüz buna 'istikrar' diyor, oysa aslında bir asma köprü."}},
  gemini:{name:{en:"Gemini",tr:"İkizler"},glyph:"♊",dates:{en:"May 21 – Jun 20",tr:"21 May – 20 Haz"},traits:{en:["Quick-witted","Chaotic","Three tabs deep"],tr:["Hazırcevap","Kaotik","Üç sekme derin"]},verdict:{en:"You contain multitudes, most of which contradict each other before breakfast. You've had six personalities today and none of them signed a waiver. Your attention span is a browser with 47 tabs open, one playing music you cannot locate, and you refuse to close any of them.",tr:"İçinizde çokluklar barındırıyorsunuz; çoğu kahvaltıdan önce birbirleriyle çelişiyor. Bugün altı farklı kişilik oldunuz ve hiçbiri sorumluluk sözleşmesi imzalamadı. Dikkat süreniz 47 sekmesi açık bir tarayıcı; biri yerini bulamadığınız bir müzik çalıyor ve hiçbirini kapatmayı reddediyorsunuz."},match:{en:"Libra (banter partners) or Aquarius (nobody bats an eye)",tr:"Terazi (atışma ortağı) ya da Kova (kimse yadırgamaz)"},shadow:{en:"Your shadow side RSVPs yes and then sends a hologram.",tr:"Gölge yönünüz 'evet' der, sonra yerine bir hologram gönderir."}},
  cancer:{name:{en:"Cancer",tr:"Yengeç"},glyph:"♋",dates:{en:"Jun 21 – Jul 22",tr:"21 Haz – 22 Tem"},traits:{en:["Fiercely loyal","Emotional archive","Soft shell"],tr:["Fena sadık","Duygusal arşiv","Yumuşak kabuk"]},verdict:{en:"You are a crab wearing a cardigan: soft inside, armored outside, and willing to pinch anyone who upsets your people. You remember what someone said to you in 2014, in a hallway, and yes, you have thought about it this week. Group chats fear your screenshot habit.",tr:"Hırka giymiş bir yengeçsiniz: içi yumuşak, dışı zırhlı ve sevdiklerinizi üzen herkesi çimdiklemeye hazır. Birinin 2014'te bir koridorda size söylediğini hatırlıyorsunuz ve evet, bu hafta onu düşündünüz. Grup sohbetleri ekran görüntüsü alışkanlığınızdan korkuyor."},match:{en:"Pisces (feelings understood) or Taurus (someone to fold the laundry)",tr:"Balık (duygular anlaşılır) ya da Boğa (çamaşırı katlayacak biri)"},shadow:{en:"Your shadow side builds a moat and then wonders why nobody visits.",tr:"Gölge yönünüz bir hendek kazıyor, sonra kimse neden gelmiyor diye merak ediyor."}},
  leo:{name:{en:"Leo",tr:"Aslan"},glyph:"♌",dates:{en:"Jul 23 – Aug 22",tr:"23 Tem – 22 Ağu"},traits:{en:["Radiant","Main character","Generous tyrant"],tr:["Işıltılı","Başrol","Cömert tiran"]},verdict:{en:"You don't enter rooms, you are cast into them. Your group chat exists because you started it, and you also decide where everyone eats — loudly, democratically, in your favor. Beneath the spotlight is a person who remembers everyone's birthday and buys the best gifts.",tr:"Odalara girmezsiniz, odaya atanırsınız. Grup sohbetiniz var çünkü onu siz başlattınız ve herkesin nerede yiyeceğine de siz karar veriyorsunuz — yüksek sesle, demokratik bir şekilde, kendi lehinize. Spot ışığının altında herkesin doğum gününü hatırlayan ve en iyi hediyeleri alan biri var."},match:{en:"Aries (mutual hype squad) or Sagittarius (double feature)",tr:"Koç (karşılıklı moral ekibi) ya da Yay (çifte gösterim)"},shadow:{en:"Your shadow side needs a witness for its own generosity.",tr:"Gölge yönünüz kendi cömertliğine bir tanık arıyor."}},
  virgo:{name:{en:"Virgo",tr:"Başak"},glyph:"♍",dates:{en:"Aug 23 – Sep 22",tr:"23 Ağu – 22 Eyl"},traits:{en:["Precise","Quietly superior","Secretly funny"],tr:["Kesin","Sessizce üstün","Gizlice komik"]},verdict:{en:"You have a system for your systems, and you've mentally reorganized this quiz while answering it. Your love language is fixing things nobody knew were broken. You're not judgmental — you just notice everything and, tragically, can articulate it.",tr:"Sistemlerinizin bile bir sistemi var ve siz bu testi yanıtlarken zihninizde yeniden düzenlediniz. Sevgi diliniz kimsenin bozuk olduğunu bilmediği şeyleri tamir etmek. Yargılayıcı değilsiniz — sadece her şeyi fark ediyorsunuz ve ne yazık ki bunu dile getirebiliyorsunuz."},match:{en:"Taurus (peaceful) or Capricorn (efficiency twins)",tr:"Boğa (huzurlu) ya da Oğlak (verimlilik ikizleri)"},shadow:{en:"Your shadow side edits other people's texts in its head.",tr:"Gölge yönünüz başkalarının mesajlarını kafasında düzeltiyor."}},
  libra:{name:{en:"Libra",tr:"Terazi"},glyph:"♎",dates:{en:"Sep 23 – Oct 22",tr:"23 Eyl – 22 Eki"},traits:{en:["Charming","Conflict-averse","Cannot pick a restaurant"],tr:["Çekici","Çatışmadan kaçan","Restoran seçemez"]},verdict:{en:"You would rather be wrong together than right alone. You've been 'fine, whatever you want' since birth, and inside there is a small librarian screaming about font choices. Everyone tells you their secrets because you look like a warm lamp that listens.",tr:"Birlikte yanılmak, tek başına haklı olmaktan iyidir sizin için. Doğduğunuzdan beri 'iyiyim, sen ne istersen' diyorsunuz ve içeride küçük bir kütüphaneci font seçimleri için çığlık atıyor. Herkes size sırlarını anlatıyor çünkü siz dinleyen sıcak bir lamba gibi görünüyorsunuz."},match:{en:"Gemini (endless conversation) or Aquarius (opposites, politely)",tr:"İkizler (bitmeyen sohbet) ya da Kova (kibar zıtlıklar)"},shadow:{en:"Your shadow side keeps the peace by abandoning the self.",tr:"Gölge yönünüz huzuru kendinden vazgeçerek koruyor."}},
  scorpio:{name:{en:"Scorpio",tr:"Akrep"},glyph:"♏",dates:{en:"Oct 23 – Nov 21",tr:"23 Eki – 21 Kas"},traits:{en:["Intense","Unforgetting","Weirdly magnetic"],tr:["Yoğun","Unutmayan","Tuhaf biçimde mıknatıslı"]},verdict:{en:"You answer a question with a question, and somehow you're the one being interviewed afterward. People tell you things they've never told anyone, within eleven minutes of meeting you. You do not hold grudges — you hold files, indexed and backed up to the cloud.",tr:"Bir soruya soruyla karşılık veriyorsunuz ve sonunda röportaj yapılan siz oluyorsunuz. İnsanlar sizinle tanıştıktan on bir dakika sonra kimseye söylemedikleri şeyleri anlatıyorlar. Kin tutmuyorsunuz — dosya tutuyorsunuz; indekslenmiş ve buluta yedeklenmiş."},match:{en:"Cancer (ride or die) or Pisces (deep end together)",tr:"Yengeç (sonuna kadar) ya da Balık (birlikte derin sulara)"},shadow:{en:"Your shadow side forgives but never deletes the folder.",tr:"Gölge yönünüz affediyor ama klasörü asla silmiyor."}},
  sagittarius:{name:{en:"Sagittarius",tr:"Yay"},glyph:"♐",dates:{en:"Nov 22 – Dec 21",tr:"22 Kas – 21 Ara"},traits:{en:["Blunt","Restless","Funnily unhinged"],tr:["Açık sözlü","Huzursuz","Komik derecede kaçık"]},verdict:{en:"You said the thing out loud. In a meeting. On purpose. Your passport has more personality than most people's resumes, and your plan is 'vibes and a departure time.' You give terrible advice with absolute confidence, and, weirdly, it works.",tr:"O şeyi yüksek sesle söylediniz. Bir toplantıda. Bilerek. Pasaportunuz çoğu insanın özgeçmişinden daha fazla kişiliğe sahip ve planınız 'hissiyat ve bir kalkış saati.' Berbat tavsiyeleri mutlak bir özgüvenle veriyorsunuz ve tuhaf biçimde işe yarıyor."},match:{en:"Aries (adventure cult) or Leo (standing ovation included)",tr:"Koç (maceracı tarikat) ya da Aslan (ayakta alkış dahil)"},shadow:{en:"Your shadow side calls it honesty when it's really a confetti cannon.",tr:"Gölge yönünüz buna dürüstlük diyor, oysa aslında bir konfeti topu."}},
  capricorn:{name:{en:"Capricorn",tr:"Oğlak"},glyph:"♑",dates:{en:"Dec 22 – Jan 19",tr:"22 Ara – 19 Oca"},traits:{en:["Ambitious","Dry as parchment","Old soul"],tr:["Hırslı","Parşömen kadar kuru","Yaşlı ruh"]},verdict:{en:"You were 12 going on 45, and now you're 45 going on mildly relaxed. Fun isn't banned, it's just scheduled — Sunday, 4–6pm, weather permitting. You show love by handling logistics nobody else wanted, then acting like it was nothing.",tr:"12 yaşındayken 45 gibiydiniz, şimdi 45 yaşındasınız ve hafifçe gevşemiş bir 45 gibi. Eğlence yasak değil, sadece planlı — Pazar, 16:00–18:00, hava müsaitse. Kimsenin üstlenmek istemediği lojistiği hallederek sevgi gösteriyor, sonra hiçbir şey değilmiş gibi davranıyorsunuz."},match:{en:"Virgo (silent understanding) or Taurus (earned comfort)",tr:"Başak (sessiz anlayış) ya da Boğa (hak edilmiş konfor)"},shadow:{en:"Your shadow side calls it discipline when it's really a locked door.",tr:"Gölge yönünüz buna disiplin diyor, oysa aslında kilitli bir kapı."}},
  aquarius:{name:{en:"Aquarius",tr:"Kova"},glyph:"♒",dates:{en:"Jan 20 – Feb 18",tr:"20 Oca – 18 Şub"},traits:{en:["Original","Alien energy","Principled gremlin"],tr:["Özgün","Uzaylı enerjisi","İlkeli gremlin"]},verdict:{en:"You have opinions about pigeons and you will share them. You're the friend who goes quiet, then says something so strange and brilliant the table goes still. You care about humanity in bulk and get awkward with individual humans, which is its own kind of poetry.",tr:"Güvercinler hakkında fikirleriniz var ve bunları paylaşacaksınız. Sessizleşen, sonra o kadar tuhaf ve parlak bir şey söyleyen arkadaşsınız ki masa bir an duruyor. İnsanlığı toptan önemsiyorsunuz ve tek tek insanlarla garipleşiyorsunuz; bu da başlı başına bir şiir."},match:{en:"Gemini (brain-meld) or Libra (opposites, politely)",tr:"İkizler (zihin birleşmesi) ya da Terazi (kibar zıtlıklar)"},shadow:{en:"Your shadow side loves humanity but forgets to text back a human.",tr:"Gölge yönünüz insanlığı seviyor ama bir insana geri yazmayı unutuyor."}},
  pisces:{name:{en:"Pisces",tr:"Balık"},glyph:"♓",dates:{en:"Feb 19 – Mar 20",tr:"19 Şub – 20 Mar"},traits:{en:["Dreamy","Empathic","Chronically late"],tr:["Hayalperest","Empatik","Kronik geç"]},verdict:{en:"You cried at a commercial for insurance. You apologize to furniture you bump into. You have three imaginary soundtracks playing during ordinary errands, and you're the main character in all of them. Somehow, impossibly, people feel safer around you.",tr:"Bir sigorta reklamına ağladınız. Çarptığınız mobilyalardan özür diliyorsunuz. Sıradan işleriniz sırasında kafanızda üç hayali film müziği çalıyor ve hepsinde başrol sizsiniz. Bir şekilde, imkânsız gibi görünse de, insanlar yanınızda kendini daha güvende hissediyor."},match:{en:"Cancer (twin tide) or Scorpio (deep end together)",tr:"Yengeç (ikiz gelgit) ya da Akrep (birlikte derin sulara)"},shadow:{en:"Your shadow side dissolves instead of deciding.",tr:"Gölge yönünüz karar vermek yerine çözülüp gidiyor."}}
};

      tr:"Başkalarının kupa koleksiyonu yaptığı gibi siz fikir topluyorsunuz. Tek bir soruyla bir hafta sonu geçirip kimsenin istemediği ama herkesin ihtiyaç duyduğu bir çerçeveyle çıkmaktan mutlu olursunuz. Keyfi kurallara alerjiniz var ve bitirmeye karşı hafif bir alerjiniz var. Dünya bir bulmaca ve içtenlikle hâlâ üzerinde çalışıyorsunuz."}},
  ENTJ:{name:{en:"The Commander",tr:"Komutan"},
    desc:{en:"You walk into chaos and see a to-do list. You're not bossy — you just have the clearest map and don't see why anyone would pretend otherwise. You respect competence, hate wasted time, and secretly worry you're the only adult in the room. You are, most days. You also have more warmth than you let anyone see.",
      tr:"Kaosun içine girip bir yapılacaklar listesi görüyorsunuz. Otoriter değilsiniz — sadece en net haritaya sahipsiniz ve kimsenin aksini iddia etmesinin nedenini anlamıyorsunuz. Yetkinliğe saygı duyuyor, boşa harcanan zamandan nefret ediyor ve içten içe odadaki tek yetişkin siz olduğunuzdan endişeleniyorsunuz. Çoğu gün öylesiniz. Ayrıca kimseye göstermediğinizden daha fazla sıcaklığa sahipsiniz."}},
  ENTP:{name:{en:"The Debater",tr:"Tartışmacı"},
    desc:{en:"You have never met an assumption you didn't want to poke. You argue for sport, brainstorm for fun, and can defend three contradictory positions before lunch. You're the friend who makes people think. Your weakness is that starting things is more fun than finishing them — and you have a folder full of unfinished starts to prove it.",
      tr:"Dürtmek istemediğiniz bir varsayımla hiç karşılaşmadınız. Spor olsun diye tartışır, eğlence olsun diye beyin fırtınası yapar ve öğle yemeğinden önce üç çelişkili pozisyonu savunabilirsiniz. İnsanlara düşündüren arkadaşsınız. Zayıf noktanız, bir şeye başlamanın onu bitirmekten daha eğlenceli olması — ve bunu kanıtlayan yarım kalmış başlangıçlarla dolu bir klasörünüz var."}},
  INFJ:{name:{en:"The Advocate",tr:"Savunucu"},
    desc:{en:"You feel everything and say almost none of it. You read people like weather and quietly adjust your own forecast to make the room comfortable. You have convictions that run deep and a private vision of how things could be. Your weakness is that you give so much of yourself away that you forget to check the balance.",
      tr:"Her şeyi hissediyor ve neredeyse hiçbirini söylemiyorsunuz. İnsanları hava durumu gibi okuyorsunuz ve odayı rahatlatmak için kendi tahmininizi sessizce ayarlıyorsunuz. Derinlere inen kanaatleriniz ve işlerin nasıl olabileceğine dair özel bir vizyonunuz var. Zayıf noktanız, kendinizden o kadar çok veriyorsunuz ki dengeyi kontrol etmeyi unutuyorsunuz."}},
  INFP:{name:{en:"The Mediator",tr:"Arabulucu"},
    desc:{en:"You keep an inner world that is richer than most people suspect, and you protect it fiercely. You believe in people before they believe in themselves, and you notice beauty in small, specific things. Your weakness is that the gap between your values and the real world can feel enormous — and you'd rather feel that ache than compromise.",
      tr:"Çoğu insanın tahmin ettiğinden daha zengin bir iç dünya taşıyorsunuz ve onu şiddetle koruyorsunuz. İnsanlar kendilerine inanmadan önce siz onlara inanıyorsunuz ve güzelliği küçük, spesifik şeylerde fark ediyorsunuz. Zayıf noktanız, değerlerinizle gerçek dünya arasındaki uçurumun muazzam hissedebilmesi — ve siz o sızıyı hissetmeyi taviz vermeye tercih ediyorsunuz."}},
  ENFJ:{name:{en:"The Protagonist",tr:"Öncü"},
    desc:{en:"You are the person other people call when they need to hear the truth wrapped in warmth. You lead by making people feel seen, and you have an uncanny sense of what a group needs before the group knows it. Your weakness is overcommitment — you say yes because you can, then wonder why you're exhausted.",
      tr:"İnsanların gerçeği sıcaklıkla sarılı duymaya ihtiyaç duyduklarında aradıkları kişisiniz. İnsanlara görüldüklerini hissettirerek liderlik ediyorsunuz ve bir grubun neye ihtiyacı olduğunu grup bilmeden önce sezen nadir insanlardansınız. Zayıf noktanız aşırı taahhüt — yapabildiğiniz için evet diyorsunuz, sonra neden tükendiğinizi merak ediyorsunuz."}},
  ENFP:{name:{en:"The Campaigner",tr:"Kampanyacı"},
    desc:{en:"You bring a kind of contagious aliveness to everything you touch, and you genuinely believe the best about people until proven otherwise. You have a thousand ideas and the enthusiasm of someone who has never met a bad one. Your weakness is that you're always starting something new — and rarely the same thing twice.",
      tr:"Dokunduğunuz her şeye bulaşıcı bir canlılık getiriyorsunuz ve aksi kanıtlanana kadar insanlar hakkında gerçekten en iyisini düşünüyorsunuz. Bin tane fikriniz var ve hiç kötü bir fikirle karşılaşmamış biri kadar coşkunuz var. Zayıf noktanız, her zaman yeni bir şeye başlamanız — ve nadiren aynı şeye iki kez."}},
  ISTJ:{name:{en:"The Logistician",tr:"Lojistikçi"},
    desc:{en:"You are the person whose word is a fact and whose calendar is a promise. You do the thing, on time, done right, and you'd rather be quietly dependable than loudly impressive. You're not rigid — you just believe that rules exist for reasons, and someone should remember them. That someone is you.",
      tr:"Sözü bir olgu, takvimi bir söz olan kişisiniz. İşi zamanında ve doğru yaparsınız ve yüksek sesle etkileyici olmaktansa sessizce güvenilir olmayı tercih edersiniz. Katı değilsiniz — sadece kuralların nedenleri olduğuna ve birinin onları hatırlaması gerektiğine inanıyorsunuz. O birisi sizsiniz."}},
  ISFJ:{name:{en:"The Defender",tr:"Koruyucu"},
    desc:{en:"You remember the details other people forget — allergies, birthdays, the thing someone said they were worried about last month. You take care of people so quietly that sometimes they forget to take care of you. Your weakness is that you'll say 'I'm fine' when you're not, because asking for help feels like a burden.",
      tr:"Başkalarının unuttuğu detayları hatırlıyorsunuz — alerjiler, doğum günleri, birinin geçen ay endişelendiğini söylediği şey. İnsanlarla o kadar sessiz ilgileniyorsunuz ki bazen sizinle ilgilenmeyi unutuyorlar. Zayıf noktanız, iyi olmadığınızda 'iyiyim' demeniz, çünkü yardım istemek yük gibi hissettiriyor."}},
  ESTJ:{name:{en:"The Executive",tr:"Yönetici"},
    desc:{en:"You believe that things get done when someone makes them get done, and you're willing to be that someone. You have strong opinions about how the group should run and a low tolerance for meetings that could have been an email. Your weakness is that you call it 'direct' when it lands as 'harsh.'",
      tr:"Birinin yapılmasını sağladığında işlerin yapıldığına inanıyorsunuz ve o birisi olmaya hazırsınız. Grubun nasıl yönetilmesi gerektiği konusunda güçlü görüşleriniz var ve e-posta olabilecek toplantılara karşı toleransınız düşük. Zayıf noktanız, 'sert' olarak düştüğünde buna 'doğrudan' diyorsunuz."}},
  ESFJ:{name:{en:"The Consul",tr:"Konsolos"},
    desc:{en:"You are the glue of every group you're in, and you take that role seriously. You host, you check in, you notice who's been quiet. You care what people think, not out of vanity, but because belonging matters to you deeply. Your weakness is that criticism lands harder than it should.",
      tr:"İçinde bulunduğunuz her grubun tutkalısınız ve bu rolü ciddiye alıyorsunuz. Ev sahipliği yapar, nabız yoklar, kimin sessiz kaldığını fark edersiniz. İnsanların ne düşündüğünü önemsiyorsunuz, kibir yüzünden değil, çünkü aidiyet sizin için derinden önemli. Zayıf noktanız, eleştiri olması gerekenden daha sert dokunuyor."}},
  ISTP:{name:{en:"The Virtuoso",tr:"Virtüöz"},
    desc:{en:"You're at your best when something is broken, sharp, or moving, and everyone else has stepped back. You learn by doing, you distrust talk, and you've always got a tool or a fix in reach. You feel things deeply but rarely narrate them. Your weakness is that you'd rather disappear than explain.",
      tr:"Bir şey bozuk, keskin ya da hareketli olduğunda ve herkes geri çekildiğinde en iyi halinizdesiniz. Yaparak öğrenir, konuşmaya güvenmez ve elinizin altında her zaman bir alet ya da bir çözüm bulundurursunuz. Derinden hissedersiniz ama nadiren anlatırsınız. Zayıf noktanız, açıklamaktansa kaybolmayı tercih ediyorsunuz."}},
  ISFP:{name:{en:"The Adventurer",tr:"Maceracı"},
    desc:{en:"You live in the present tense with more grace than most people manage, and you see beauty where others see ordinariness. You don't need to be the center of attention — you'd rather be quietly making something, or somewhere new, or both. Your weakness is that you avoid conflict long past the point where it would help.",
      tr:"Şimdiki zamanda çoğu insanın başaramayacağı bir zarafetle yaşıyorsunuz ve başkalarının sıradanlık gördüğü yerde güzellik görüyorsunuz. İlgi odağı olmak zorunda değilsiniz — sessizce bir şey yapmayı ya da yeni bir yerde olmayı, ya da ikisini birden tercih edersiniz. Zayıf noktanız, faydalı olacağı noktayı çoktan geçene kadar çatışmadan kaçınıyorsunuz."}},
  ESTP:{name:{en:"The Entrepreneur",tr:"Girişimci"},
    desc:{en:"You move first and refine later, and honestly, the strategy usually works. You're calm in chaos, charming under pressure, and allergic to meetings that could have been a walk-and-talk. You read rooms faster than most people read headlines. Your weakness is patience — with slow processes, and with slow people.",
      tr:"Önce hareket eder, sonra iyileştirirsiniz ve dürüst olmak gerekirse bu strateji genelde işe yarar. Kaosta sakinsiniz, baskı altında çekicisiniz ve yürüyerek konuşulabilecek toplantılara alerjiniz var. Çoğu insanın manşetleri okuduğundan daha hızlı odaları okursunuz. Zayıf noktanız sabır — yavaş süreçlere ve yavaş insanlara karşı."}},
  ESFP:{name:{en:"The Entertainer",tr:"Eğlendiren"},
    desc:{en:"You are the reason the party has a heartbeat. You make people laugh, you make people comfortable, and you do it without trying. You live in color and you bring other people into that color with you. Your weakness is that the future has a hard time competing with how good right now feels.",
      tr:"Partinin bir kalp atışı olmasının sebebi sizsiniz. İnsanları güldürüyor, rahatlatıyorsunuz ve bunu çabalamadan yapıyorsunuz. Renkli yaşıyorsunuz ve diğer insanları da o renge dahil ediyorsunuz. Zayıf noktanız, şu anın bu kadar iyi hissettirmesiyle geleceğin rekabet etmekte zorlanması."}}
};

/* ============================================================
   STATE
   ============================================================ */
let lang = "en";
let currentIndex = 0;
let zodiacScores = {};
let zodiacLastAt = {};
let mbtiScores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };

const SEQUENCE = [
  ...INTAKE.map(item => ({ kind:"intake", data:item })),
  ...ZODIAC_QUIZ.map(item => ({ kind:"zodiac", data:item })),
  ...MBTI_QUIZ.map(item => ({ kind:"mbti", data:item }))
];

function resetState(){
  currentIndex = 0;
  zodiacScores = {};
  zodiacLastAt = {};
  for (const k in SIGNS){ zodiacScores[k] = 0; zodiacLastAt[k] = -1; }
  mbtiScores = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
}

/* ============================================================
   DOM
   ============================================================ */
const el = {
  brandText: document.getElementById("brand-text"),
  appTitle: document.getElementById("app-title"),
  appSubtitle: document.getElementById("app-subtitle"),
  progressRow: document.getElementById("progress-row"),
  progressLabel: document.getElementById("progress-label"),
  progressPct: document.getElementById("progress-pct"),
  barWrap: document.getElementById("bar-wrap"),
  barFill: document.getElementById("bar-fill"),
  content: document.getElementById("content"),
  thinking: document.getElementById("thinking"),
  thinkingText: document.getElementById("thinking-text"),
  pulse: document.getElementById("pulse"),
  langEn: document.getElementById("lang-en"),
  langTr: document.getElementById("lang-tr")
};
const t = (key) => I18N[lang][key];

/* ============================================================
   LANGUAGE
   ============================================================ */
function setLang(next){
  if (lang === next) return;
  lang = next;
  el.langEn.setAttribute("aria-pressed", String(lang === "en"));
  el.langTr.setAttribute("aria-pressed", String(lang === "tr"));
  document.documentElement.lang = lang;
  el.brandText.textContent = t("brand");
  el.appTitle.textContent = t("title");
  el.appSubtitle.textContent = t("subtitle");
  if (currentIndex < SEQUENCE.length) renderQuestion();
  else showResult();
}
el.langEn.addEventListener("click", () => setLang("en"));
el.langTr.addEventListener("click", () => setLang("tr"));

/* ============================================================
   HELPERS
   ============================================================ */
function getLeadingSign(){
  let max = -Infinity, leader = null;
  for (const k in zodiacScores){
    if (zodiacScores[k] > max){ max = zodiacScores[k]; leader = k; }
  }
  return max === 0 ? null : leader;
}
function updateThinking(){
  const item = SEQUENCE[currentIndex];
  const leader = getLeadingSign();
  if (item && item.kind === "mbti"){
    const e = mbtiScores.E, i = mbtiScores.I;
    const s = mbtiScores.S, n = mbtiScores.N;
    const tt = mbtiScores.T, f = mbtiScores.F;
    const j = mbtiScores.J, p = mbtiScores.P;
    const partial =
      (e >= i ? "E" : "I") + (s >= n ? "S" : "N") + (tt >= f ? "T" : "F") + (j >= p ? "J" : "P");
    el.thinkingText.innerHTML = `${t("thinkingPrefix")} <b>${partial}</b>`;
    el.pulse.classList.remove("done");
    return;
  }
  if (!leader){
    el.thinkingText.textContent = t("thinkingEmpty");
    el.pulse.classList.remove("done");
    return;
  }
  const name = SIGNS[leader].name[lang];
  const glyph = SIGNS[leader].glyph;
  el.thinkingText.innerHTML = `${t("thinkingPrefix")} <b>${glyph} ${name}</b>`;
  el.pulse.classList.remove("done");
}
function updateProgress(){
  const total = SEQUENCE.length;
  const pct = Math.round((currentIndex / total) * 100);
  el.progressLabel.textContent = `${t("question")} ${currentIndex + 1} ${t("of")} ${total}`;
  el.progressPct.textContent = `${pct}%`;
  el.barFill.style.width = `${pct}%`;
  el.barWrap.setAttribute("aria-valuenow", String(pct));
}

/* ============================================================
   RENDER
   ============================================================ */
function renderQuestion(){
  const item = SEQUENCE[currentIndex];
  const q = item.data;

  el.progressRow.hidden = false;
  el.barWrap.hidden = false;
  el.thinking.hidden = false;
  updateProgress();
  updateThinking();

  let sectionLabel;
  if (item.kind === "intake") sectionLabel = t("sectionIntake");
  else if (item.kind === "zodiac") sectionLabel = t("sectionZodiac");
  else sectionLabel = t("sectionMbti");

  const optsHtml = q.o.map((opt, i) =>
    `<button class="opt" type="button" data-idx="${i}">${opt.t[lang]}</button>`
  ).join("");

  el.content.innerHTML = `
    <span class="section-tag">${sectionLabel}</span>
    <h2 class="q" id="q-heading">${q.q[lang]}</h2>
    <div class="opts" role="group" aria-labelledby="q-heading">${optsHtml}</div>
  `;

  el.content.querySelectorAll(".opt").forEach(btn =>
    btn.addEventListener("click", handleAnswer)
  );
}

/* ============================================================
   ANSWER
   ============================================================ */
function handleAnswer(e){
  const btn = e.currentTarget;
  const idx = parseInt(btn.dataset.idx, 10);
  const item = SEQUENCE[currentIndex];
  const chosen = item.data.o[idx];

  el.content.querySelectorAll(".opt").forEach(b => b.disabled = true);

  if (item.kind === "intake"){
    zodiacScores[chosen.p] += 2;
    zodiacScores[chosen.s] += 1;
    zodiacLastAt[chosen.p] = currentIndex;
  } else if (item.kind === "zodiac"){
    zodiacScores[chosen.s] += 1;
    zodiacLastAt[chosen.s] = currentIndex;
  } else {
    mbtiScores[chosen.a] += 1;
  }

  currentIndex++;

  if (currentIndex < SEQUENCE.length){
    setTimeout(() => {
      renderQuestion();
      el.content.classList.remove("fade");
      void el.content.offsetWidth;
      el.content.classList.add("fade");
    }, 180);
  } else {
    setTimeout(showResult, 220);
  }
}

/* ============================================================
   RESULT
   ============================================================ */
function getTopSign(){
  let max = -Infinity, candidates = [];
  for (const k in zodiacScores){
    const v = zodiacScores[k];
    if (v > max){ max = v; candidates = [k]; }
    else if (v === max) candidates.push(k);
  }
  if (candidates.length === 1) return candidates[0];
  candidates.sort((a,b) => {
    if (zodiacLastAt[b] !== zodiacLastAt[a]) return zodiacLastAt[b] - zodiacLastAt[a];
    return a.localeCompare(b);
  });
  return candidates[0];
}
function getMbtiType(){
  const type =
    (mbtiScores.E >= mbtiScores.I ? "E" : "I") +
    (mbtiScores.S >= mbtiScores.N ? "S" : "N") +
    (mbtiScores.T >= mbtiScores.F ? "T" : "F") +
    (mbtiScores.J >= mbtiScores.P ? "J" : "P");
  return type;
}
function axisPair(a, b, labelA, labelB){
  const va = mbtiScores[a], vb = mbtiScores[b];
  const total = va + vb || 1;
  const pctA = Math.round((va / total) * 100);
  const pctB = 100 - pctA;
  return { labelA, labelB, pctA, pctB };
}
function bridgeText(zodiacKey, mbtiType){
  const s = SIGNS[zodiacKey];
  const sun = s.name[lang];
  const m = mbtiType;
  const templates = {
    en:{
      intro:`Your ${sun} energy describes how you show up. Your ${m} type describes how you think and decide. Put together, the picture gets specific.`,
      lines:[
        `You lead with the emotional weather of ${sun} and process the world through the framework of ${m}.`,
        `When ${sun}'s impulse and ${m}'s instinct agree, you're unstoppable. When they don't, you feel the tug.`,
        `The person your friends recognize is the ${sun}. The person you are at 3am is the ${m}.`,
        `Most people see the ${sun}. The ones who know you see the ${m}.`
      ]
    },
    tr:{
      intro:`${sun} enerjiniz nasıl göründüğünüzü anlatıyor. ${m} tipiniz nasıl düşündüğünüzü ve karar verdiğinizi anlatıyor. Bir araya geldiklerinde tablo netleşiyor.`,
      lines:[
        `${sun}'ın duygusal havasıyla öne çıkıyor ve dünyayı ${m} çerçevesiyle işliyorsunuz.`,
        `${sun}'ın dürtüsü ile ${m}'in içgüdüsü aynı fikirde olduğunda durdurulamazsınız. Olmadığında aradaki çekişi hissedersiniz.`,
        `Arkadaşlarınızın tanıdığı kişi ${sun}. Gece 03:00'te olduğunuz kişi ${m}.`,
        `Çoğu insan ${sun}'ı görür. Sizi tanıyanlar ${m}'i görür.`
      ]
    }
  };
  const pack = templates[lang];
  // Pick a bridge line deterministically from type hash
  const seed = (zodiacKey + mbtiType).split("").reduce((a,c)=>a + c.charCodeAt(0), 0);
  const line = pack.lines[seed % pack.lines.length];
  return `<b>${t("bridgePrefix")}</b> ${pack.intro} ${line}`;
}

function showResult(){
  const zKey = getTopSign();
  const z = SIGNS[zKey];
  const mKey = getMbtiType();
  const m = MBTI_TYPES[mKey];
  const total = SEQUENCE.length;

  el.progressRow.hidden = false;
  el.barWrap.hidden = false;
  el.barFill.style.width = "100%";
  el.progressLabel.textContent = `${t("question")} ${total} ${t("of")} ${total}`;
  el.progressPct.textContent = "100%";
  el.barWrap.setAttribute("aria-valuenow", "100");

  el.thinking.hidden = false;
  el.thinkingText.innerHTML = `${t("thinkingDone")} <b>${z.glyph} ${z.name[lang]} · ${mKey}</b>`;
  el.pulse.classList.add("done");

  const ePair = axisPair("E","I", t("axesE"), t("axesI"));
  const sPair = axisPair("S","N", t("axesS"), t("axesN"));
  const tPair = axisPair("T","F", t("axesT"), t("axesF"));
  const jPair = axisPair("J","P", t("axesJ"), t("axesP"));

  const axesRows = [ePair, sPair, tPair, jPair].map(p => {
    const leading = p.pctA >= 50 ? p.labelA : p.labelB;
    const pct = p.pctA >= 50 ? p.pctA : p.pctB;
    return `<div class="row"><span>${p.labelA} / ${p.labelB}</span><span>${leading} · ${pct}%</span></div>`;
  }).join("");

  el.content.innerHTML = `
    <div class="result">
      <div class="zodiac-block">
        <div class="section-tag">${t("zodiacLabel")}</div>
        <div class="glyph" aria-hidden="true">${z.glyph}</div>
        <h1 class="sign-name">${z.name[lang]}</h1>
        <div class="dates">${z.dates[lang]}</div>
        <p class="verdict">${z.verdict[lang]}</p>
        <div class="traits">
          ${z.traits[lang].map(tr => `<span class="chip">${tr}</span>`).join("")}
        </div>
        <p class="meta-line"><b>${t("bestMatch")}:</b> ${z.match[lang]}</p>
        <p class="meta-line"><b>${t("shadowSide")}:</b> ${z.shadow[lang]}</p>
      </div>

      <div class="mbti-block">
        <div class="mbti-label">${t("mbtiLabel")}</div>
        <div class="mbti-type">${mKey}</div>
        <p class="mbti-name">${m.name[lang]}</p>
        <div class="mbti-axes">${axesRows}</div>
        <p class="mbti-desc">${m.desc[lang]}</p>
      </div>

      <div class="bridge">${bridgeText(zKey, mKey)}</div>
      <p class="disclaimer">${t("disclaimer")}</p>

      <button class="cta" type="button" id="restart">${t("startOver")}</button>
    </div>
  `;

  document.getElementById("restart").addEventListener("click", () => {
    resetState();
    el.thinking.hidden = false;
    el.pulse.classList.remove("done");
    renderQuestion();
  });
}

/* ============================================================
   INIT
   ============================================================ */
resetState();
renderQuestion();
</script>
</body>
</html>
